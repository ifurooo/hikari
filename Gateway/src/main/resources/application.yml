server:
  port: 7777
spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: provider
          uri: lb://provider
          predicates:
          - Path=/provider/**
        - id: consumer
          uri: lb://consumer
          predicates:
          - Path=/consumer/**