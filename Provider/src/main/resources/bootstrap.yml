# 配置文件 bootstrap.yml：比 application.yml 更早加载，用于"引导"应用先连接上配置中心/注册中心
# 下方被 # 注释掉的行可按需取消注释使用；一般把"连接 Nacos"这类前置配置放在 bootstrap 里
#配置中心文件
#server:
#  port: 7771
spring:
#  application:
#    name: provider
  profiles:
    active: dev #激活 dev 环境：会去加载 dataId 为 provider-dev.yaml 的远程配置，实现多环境切换
  cloud:
    nacos:
#      discovery:
#        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848 #Nacos作为配置中心地址
        file-extension: yaml #指定yaml格式的配置：
                             #dataId = ${spring.application.name}-${spring.profiles.active}.${file-extension}
                             #即 provider-dev.yaml